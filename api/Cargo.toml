[package]
name = "bp-api"
version = "0.1.0"
edition = "2021"
publish = false
description = "BREACH PROTOCOL: API del tablero (Vercel Rust functions)"
license = "MIT"

[lib]
path = "src/lib.rs"

# Cada función de Vercel es un [[bin]]. Las rutas son relativas a este Cargo.toml.
[[bin]]
name = "runs"
path = "runs.rs"

[[bin]]
name = "leaderboard"
path = "leaderboard.rs"

[dependencies]
base64 = "0.22.1"
bp-core = { path = "../core" }
bytes = "1.12.2"
hmac = "0.13.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
vercel_runtime = "2.4.1"

# Raíz de workspace propia: el crate no hereda el workspace del repositorio.
[workspace]

# Perfil de release según la plantilla de Vercel para Rust.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"

# Los tests re-simulan partidas completas; sin esto cada test tarda varios segundos.
[profile.dev.package.bp-core]
opt-level = 2
