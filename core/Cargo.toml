[package]
name = "bp-core"
version = "0.1.0"
edition = "2021"
description = "SEBITA: BREACH PROTOCOL simulation core (Rust -> WebAssembly)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[profile.test]
opt-level = 2

[dependencies]
libm = "0.2.16"
