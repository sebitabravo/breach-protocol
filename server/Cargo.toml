[package]
name = "bp-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "BREACH PROTOCOL: lógica del tablero (verificación, puntajes y almacén)"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
bp-core = { path = "../core" }
bytes = "1.12.2"
hmac = "0.13.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
vercel_runtime = "2.4.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
