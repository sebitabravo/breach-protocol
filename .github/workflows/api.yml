name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "core/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - "core/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API crate (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Format check
        run: cargo fmt --manifest-path api/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path api/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path api/Cargo.toml --locked
