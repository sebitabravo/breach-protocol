name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "server/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/api.yml"
      - "scripts/check-api-bins.py"
  pull_request:
    paths:
      - "api/**"
      - "server/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/api.yml"
      - "scripts/check-api-bins.py"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API workspace (fmt, clippy, tests, Linux release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Verify Vercel binary layout (Linux x86_64)
        shell: bash
        run: |
          cargo build --release --bins --target x86_64-unknown-linux-gnu --workspace --locked --message-format=json-render-diagnostics \
            | python3 scripts/check-api-bins.py
