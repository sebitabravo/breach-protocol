name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust core (tests + wasm build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cargo tests
        run: cargo test --manifest-path core/Cargo.toml --locked
      - name: Build wasm artifact
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path core/Cargo.toml --locked

  web:
    name: Web shell (typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm run test:unit
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build (wasm + tsc + vite)
        run: npm run build
      - name: E2E smoke (Playwright)
        run: npm run test:e2e
