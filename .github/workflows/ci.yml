name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (tests + wasm build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format check
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Cargo tests
        run: cargo test --manifest-path core/Cargo.toml --locked
      - name: Build wasm artifact
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path core/Cargo.toml --locked

  web:
    name: Web shell (typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock') }}
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests (Vitest)
        run: bun run test:unit
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: Build (wasm + tsc + vite)
        run: bun run build
      - name: E2E smoke (Playwright)
        run: bun run test:e2e
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
